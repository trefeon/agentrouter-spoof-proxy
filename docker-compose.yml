services:
  agentrouter-proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: agentrouter-proxy
    ports:
      - "${LISTEN_PORT:-8318}:${LISTEN_PORT:-8318}"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    environment:
      - LISTEN_PORT=${LISTEN_PORT:-8318}
      # Docker-to-Docker exposure: the container must listen on all interfaces
      # so 9Router (on the same network) can reach it by container name/IP.
      # Host mode uses the secure default 127.0.0.1 unless overridden.
      - LISTEN_ADDRESS=0.0.0.0
      - TARGET_HOST=${TARGET_HOST:-agentrouter.org}
      - TARGET_PORT=${TARGET_PORT:-443}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-300000}
      - MODELS_CSV=${MODELS_CSV:-gpt-5.6-sol,claude-opus-5,claude-opus-4-8}
      - WARMUP_INTERVAL_MS=${WARMUP_INTERVAL_MS:-180000}
      - MAX_RETRIES=${MAX_RETRIES:-2}
      - RETRY_DELAY_MS=${RETRY_DELAY_MS:-1000}
      - AR_API_KEY=${AR_API_KEY:-}
      - DISCOVERY_INTERVAL_MS=${DISCOVERY_INTERVAL_MS:-600000}
      - INJECT_SYSTEM_PROMPT=${INJECT_SYSTEM_PROMPT:-}
      - SSE_IDLE_TIMEOUT_MS=${SSE_IDLE_TIMEOUT_MS:-600000}
      - SSE_CHUNK_TIMEOUT_MS=${SSE_CHUNK_TIMEOUT_MS:-30000}
      - RESPONSE_TIMEOUT_MS=${RESPONSE_TIMEOUT_MS:-30000}
      - BODY_UPLOAD_TIMEOUT_MS=${BODY_UPLOAD_TIMEOUT_MS:-60000}
      - SLOW_RESPONSE_MS=${SLOW_RESPONSE_MS:-30000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Optional inbound auth token. Recommended whenever the proxy is exposed
      # beyond localhost or the private Docker network.
      - PROXY_AUTH_TOKEN=${PROXY_AUTH_TOKEN:-}
    sysctls:
      - net.ipv4.tcp_keepalive_time=60
      - net.ipv4.tcp_keepalive_intvl=10
      - net.ipv4.tcp_keepalive_probes=3
    restart: unless-stopped
